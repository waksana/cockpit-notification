name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - id: sdk
        run: node scripts/sdk.mjs info >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ steps.sdk.outputs.repository }}
          ref: ${{ steps.sdk.outputs.commit }}
          path: .host-sdk-source
          persist-credentials: false
      - run: node scripts/sdk.mjs prepare .host-sdk-source
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package
      - name: Verify exact package
        env:
          ARCHIVE: ${{ steps.sdk.outputs.archive }}
        run: node scripts/verify-package.mjs "module-output/$ARCHIVE" "$GITHUB_SHA"
      - name: Restore isolated host dependencies
        run: pnpm --dir .host-sdk-source install --frozen-lockfile --ignore-scripts
      - name: Exercise the package through its paired host
        env:
          ARCHIVE: ${{ steps.sdk.outputs.archive }}
        run: node --import ./.host-sdk-source/apps/server/node_modules/tsx/dist/loader.mjs scripts/integration.mjs .host-sdk-source "module-output/$ARCHIVE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cockpit-notification-${{ github.sha }}
          path: |
            module-output/*.tgz
            module-output/*.tgz.sha256
          if-no-files-found: error
          retention-days: 7
