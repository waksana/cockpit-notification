name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: '@waksana'
      - name: Install the published SDK without host source
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package
      - id: integration
        run: node scripts/integration-host.mjs >> "$GITHUB_OUTPUT"
      - name: Verify exact package
        env:
          ARCHIVE: ${{ steps.integration.outputs.archive }}
        run: node scripts/verify-package.mjs "module-output/$ARCHIVE" "$SOURCE_SHA"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ steps.integration.outputs.repository }}
          ref: ${{ steps.integration.outputs.commit }}
          path: .integration-host
          persist-credentials: false
      - name: Restore isolated host dependencies
        run: pnpm --dir .integration-host install --frozen-lockfile --ignore-scripts
      - name: Exercise the package through its paired host
        env:
          ARCHIVE: ${{ steps.integration.outputs.archive }}
        run: timeout 300 node --import ./.integration-host/apps/server/node_modules/tsx/dist/loader.mjs scripts/integration.mjs .integration-host "module-output/$ARCHIVE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cockpit-notification-${{ env.SOURCE_SHA }}-linux-x64
          path: |
            module-output/*.tgz
            module-output/*.tgz.sha256
          if-no-files-found: error
          retention-days: 7
