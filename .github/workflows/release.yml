# Identity authority: keep this workflow's name and path stable. Do not reset its run counter.
name: Rolling
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  packages: read

# No shared concurrency group: GitHub can replace pending jobs even without cancellation.
jobs:
  checks:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ github.event.pull_request.merge_commit_sha }}
      rolling_sequence: ${{ format('{0}', github.run_number) }}
    permissions:
      contents: read
      packages: read

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      packages: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      ROLLING_SEQUENCE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: '@waksana'
      - run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cockpit-notification-${{ env.SOURCE_SHA }}-${{ env.ROLLING_SEQUENCE }}-linux-x64
          path: release-artifact
      - name: Verify, create immutable tag, upload draft and publish verified Rolling
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-rolling.mjs release-artifact
